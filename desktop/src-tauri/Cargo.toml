[package]
name = "dbd-quick"
version = "1.0.0"
description = "Schnelleintrag für den DBD-Stats-Tracker"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
