<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DBD Stats – Übersicht</title>
  <meta name="description" content="Dead by Daylight Statistik-Tracker mit Supabase-Login.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128128;</text></svg>">
  <link rel="stylesheet" href="assets/css/style.css?v=10">
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <header class="topbar">
    <a class="topbar__brand" href="index.html">
      <span class="topbar__glyph">&#9788;</span>
      <span>DBD&nbsp;Stats</span>
    </a>
    <nav class="topbar__nav">
      <a href="index.html" class="is-active">Übersicht</a>
      <a href="stats.html">Statistik</a>
    </nav>
    <div class="topbar__user" data-auth-only hidden>
      <span class="topbar__email" data-user-email></span>
      <a class="icon-btn" href="settings.html" title="Einstellungen" aria-label="Einstellungen">&#9881;</a>
      <button type="button" class="btn btn--ghost btn--sm" data-logout>Abmelden</button>
    </div>
  </header>

  <main>
  <div id="boot-error" class="boot-error" hidden></div>

  <!-- Kein Modul: läuft auch dann, wenn der Import der App scheitert, damit
       statt einer leeren Seite eine Meldung erscheint. -->
  <script>
    (function () {
      function rendered() {
        var auth = document.getElementById('auth-view');
        var app = document.getElementById('app-view');
        return (auth && auth.children.length > 0) || (app && !app.hidden);
      }
      function show(detail) {
        var box = document.getElementById('boot-error');
        if (!box || !box.hidden || rendered()) return;   // nur wenn wirklich nichts da ist
        box.hidden = false;
        box.innerHTML = '<strong>Die App konnte nicht geladen werden.</strong>'
          + '<span>Meist hilft vollständiges Neuladen (Strg+F5 bzw. Cmd+Shift+R).</span>'
          + '<code></code>';
        box.querySelector('code').textContent = detail || '';
      }
      window.addEventListener('error', function (e) {
        var el = e.target;
        if (el && el.tagName === 'IMG') return;          // fehlende Portraits sind egal
        show(e.message || (el && el.src ? 'Nicht ladbar: ' + el.src : ''));
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        show(e.reason && e.reason.message ? e.reason.message : String(e.reason || ''));
      });
    })();
  </script>

    <section id="auth-view" class="auth-view"></section>

    <section id="app-view" class="app-view" hidden>
      <div class="page-head">
        <h1>Übersicht</h1>
        <span class="page-head__meta" id="last-played"></span>
      </div>

      <section class="kpi-grid" aria-label="Statistik">
        <article class="kpi">
          <span class="kpi__label">Matches</span>
          <strong class="kpi__value" id="kpi-total">–</strong>
          <span class="kpi__hint" id="kpi-split">–</span>
        </article>
        <article class="kpi kpi--killer">
          <span class="kpi__label"><span class="icon" data-icon="killer"></span>Kill-Rate</span>
          <strong class="kpi__value" id="kpi-killrate">–</strong>
          <span class="kpi__hint" id="kpi-kills">–</span>
        </article>
        <article class="kpi kpi--survivor">
          <span class="kpi__label"><span class="icon" data-icon="survivor"></span>Escape-Rate</span>
          <strong class="kpi__value" id="kpi-escaperate">–</strong>
          <span class="kpi__hint" id="kpi-escapes">–</span>
        </article>
        <article class="kpi kpi--bp">
          <span class="kpi__label"><span class="icon" data-icon="bp"></span>Blutpunkte</span>
          <strong class="kpi__value" id="kpi-bp">–</strong>
          <span class="kpi__hint" id="kpi-bp-avg">–</span>
        </article>
      </section>

      <div class="columns">
        <section class="panel" id="entry-panel">
          <header class="panel__head">
            <h2 id="form-title">Match eintragen</h2>
          </header>

          <form id="match-form" class="match-form" novalidate>
            <label class="field">
              <span class="field__label">Gamemode</span>
              <select id="f-mode" required></select>
            </label>

            <fieldset class="field">
              <legend class="field__label">Rolle</legend>
              <div class="segmented" role="radiogroup" aria-label="Rolle">
                <label class="segmented__opt">
                  <input type="radio" name="role" value="killer" checked>
                  <span><span class="icon" data-icon="killer"><i class="icon__fallback">&#128481;</i></span>Killer</span>
                </label>
                <label class="segmented__opt">
                  <input type="radio" name="role" value="survivor">
                  <span><span class="icon" data-icon="survivor"><i class="icon__fallback">&#127939;</i></span>Survivor</span>
                </label>
              </div>
            </fieldset>

            <div class="role-block" data-role-block="killer">
              <label class="field">
                <span class="field__label">Killer</span>
                <span class="select-row">
                  <select id="f-killer"></select>
                  <span class="portrait" id="f-killer-portrait"></span>
                </span>
              </label>

              <fieldset class="field">
                <legend class="field__label">Kills</legend>
                <div class="segmented segmented--kills" role="radiogroup" aria-label="Kills">
                  <label class="segmented__opt"><input type="radio" name="kills" value="0" checked><span>0K</span></label>
                  <label class="segmented__opt"><input type="radio" name="kills" value="1"><span>1K</span></label>
                  <label class="segmented__opt"><input type="radio" name="kills" value="2"><span>2K</span></label>
                  <label class="segmented__opt"><input type="radio" name="kills" value="3"><span>3K</span></label>
                  <label class="segmented__opt"><input type="radio" name="kills" value="4"><span>4K</span></label>
                </div>
              </fieldset>
            </div>

            <div class="role-block" data-role-block="survivor" hidden>
              <label class="field">
                <span class="field__label">Survivor</span>
                <span class="select-row">
                  <select id="f-survivor"></select>
                  <span class="portrait" id="f-survivor-portrait"></span>
                </span>
              </label>

              <label class="field">
                <span class="field__label">Gegner <em>optional</em></span>
                <span class="select-row">
                  <select id="f-faced-killer"></select>
                  <span class="portrait" id="f-faced-killer-portrait"></span>
                </span>
              </label>

              <fieldset class="field">
                <legend class="field__label">Ausgang</legend>
                <div class="segmented" role="radiogroup" aria-label="Ausgang">
                  <label class="segmented__opt segmented__opt--good">
                    <input type="radio" name="escaped" value="true" checked><span><span class="icon" data-icon="escape"></span>Entkommen</span>
                  </label>
                  <label class="segmented__opt segmented__opt--bad">
                    <input type="radio" name="escaped" value="false"><span><span class="icon" data-icon="sacrificed"></span>Gestorben</span>
                  </label>
                </div>
              </fieldset>
            </div>

            <fieldset class="field bp-field">
              <legend class="field__label"><span class="icon" data-icon="bp"></span>Blutpunkte</legend>

              <div class="bp-display">
                <input id="f-bp" type="text" inputmode="numeric" value="0"
                       aria-label="Verdiente Blutpunkte" autocomplete="off">
                <span class="bp-display__unit icon icon--bp" data-icon="bp"><i class="icon__fallback">BP</i></span>
              </div>

              <input id="f-bp-range" class="bp-slider" type="range"
                     min="0" max="1000000" step="1000" value="0" aria-label="Blutpunkte-Regler">

              <div class="bp-chips">
                <button type="button" class="chip" data-bp="10000">+10k</button>
                <button type="button" class="chip" data-bp="25000">+25k</button>
                <button type="button" class="chip" data-bp="50000">+50k</button>
                <button type="button" class="chip" data-bp="100000">+100k</button>
                <button type="button" class="chip chip--reset" data-bp="reset">Reset</button>
              </div>
            </fieldset>

            <label class="field">
              <span class="field__label">Zeitpunkt</span>
              <input type="datetime-local" id="f-played-at" required>
            </label>

            <label class="field">
              <span class="field__label">Notiz</span>
              <input type="text" id="f-notes" maxlength="500" placeholder="optional">
            </label>

            <button type="submit" class="btn btn--primary btn--block" id="f-submit">Speichern</button>
            <button type="button" class="btn btn--ghost btn--block" id="f-cancel" hidden>Abbrechen</button>
          </form>
        </section>

        <section class="panel">
          <header class="panel__head">
            <h2>Letzte Matches</h2>
          </header>
          <div class="table-wrap">
            <table class="table" id="recent-table">
              <thead>
                <tr>
                  <th>Datum</th>
                  <th>Charakter</th>
                  <th>Ergebnis</th>
                  <th class="num">BP</th>
                  <th class="num"></th>
                </tr>
              </thead>
              <tbody id="recent-body">
                <tr><td colspan="5" class="empty">Lade …</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>

      <section class="panel">
        <header class="panel__head panel__head--row">
          <h2>Serien</h2>
          <div class="tabs" id="streak-modes" role="tablist" aria-label="Gamemode"></div>
        </header>

        <div class="streak-groups">
          <div class="streak-group">
            <h3 class="subhead subhead--killer"><span class="icon" data-icon="killer"></span>Killer</h3>
            <div id="streak-killer" class="streak-grid"></div>
          </div>
          <div class="streak-group">
            <h3 class="subhead subhead--survivor"><span class="icon" data-icon="survivor"></span>Survivor</h3>
            <div id="streak-survivor" class="streak-grid"></div>
          </div>
        </div>
      </section>

      <section class="panel">
        <header class="panel__head">
          <h2>Verteilung</h2>
        </header>
        <div class="split">
          <div>
            <h3 class="subhead subhead--killer"><span class="icon" data-icon="killer"></span>Kills</h3>
            <div id="dist-kills" class="bars"></div>
          </div>
          <div>
            <h3 class="subhead subhead--survivor"><span class="icon" data-icon="survivor"></span>Ausgang</h3>
            <div id="dist-escape" class="bars"></div>
          </div>
        </div>
      </section>

    </section>
  </main>

  <script type="module" src="assets/js/index.js?v=10"></script>
</body>
</html>
