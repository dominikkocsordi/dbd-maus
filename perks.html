<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DBD Stats – Perks &amp; Builds</title>
  <meta name="description" content="Alle Perks mit Zuordnung und eigene Builds speichern.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128128;</text></svg>">
  <link rel="stylesheet" href="assets/css/style.css?v=63">
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <header class="topbar">
    <a class="topbar__brand" href="index.html">
      <span class="topbar__glyph icon" data-icon="logo"><i class="icon__fallback">&#9788;</i></span>
      <span>DBD&nbsp;Stats</span>
    </a>
    <nav class="topbar__nav">
      <a href="index.html">Übersicht</a>
      <a href="stats.html">Statistik</a>
      <a href="prestige.html">Prestige</a>
      <a href="perks.html" class="is-active">Perks</a>
      <a href="challenges.html">Challenges</a>
      <a href="friends.html">Freunde</a>
    </nav>
    <div class="topbar__user" data-auth-only hidden>
      <span class="topbar__email" data-user-email></span>
      <a class="icon-btn icon-btn--owner" href="cockpit.html" data-owner-only hidden
         title="Ticket-Cockpit" aria-label="Ticket-Cockpit">&#9670;</a>
      <a class="icon-btn" href="settings.html" title="Einstellungen" aria-label="Einstellungen">&#9881;</a>
      <button type="button" class="btn btn--ghost btn--sm" data-logout>Abmelden</button>
    </div>
  </header>

  <main>
  <div id="boot-error" class="boot-error" hidden></div>

  <!-- Kein Modul: läuft auch dann, wenn der Import der App scheitert, damit
       statt einer leeren Seite eine Meldung erscheint. -->
  <script>
    (function () {
      function rendered() {
        var auth = document.getElementById('auth-view');
        var app = document.getElementById('app-view');
        return (auth && auth.children.length > 0) || (app && !app.hidden);
      }
      function show(detail) {
        var box = document.getElementById('boot-error');
        if (!box || !box.hidden || rendered()) return;   // nur wenn wirklich nichts da ist
        box.hidden = false;
        box.innerHTML = '<strong>Die App konnte nicht geladen werden.</strong>'
          + '<span>Meist hilft vollständiges Neuladen (Strg+F5 bzw. Cmd+Shift+R).</span>'
          + '<code></code>';
        box.querySelector('code').textContent = detail || '';
      }
      window.addEventListener('error', function (e) {
        var el = e.target;
        if (el && el.tagName === 'IMG') return;          // fehlende Bilder sind egal
        show(e.message || (el && el.src ? 'Nicht ladbar: ' + el.src : ''));
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        show(e.reason && e.reason.message ? e.reason.message : String(e.reason || ''));
      });
    })();
  </script>

    <section id="auth-view" class="auth-view"></section>

    <section id="app-view" class="app-view" hidden>
      <div class="page-head">
        <h1>Perks &amp; Builds</h1>
        <span class="page-head__meta" id="perk-count"></span>
      </div>

      <!-- Build-Editor -->
      <section class="panel" id="build-panel">
        <header class="panel__head panel__head--row">
          <h2 id="build-title">Neuer Build</h2>
          <span class="panel__meta" id="build-hint"></span>
        </header>

        <div class="build-editor">
          <div class="build-slots" id="build-slots"></div>

          <form id="build-form" class="build-form" novalidate>
            <label class="field">
              <span class="field__label">Name</span>
              <input type="text" id="b-name" maxlength="60" placeholder="z.&nbsp;B. Gen-Rush" required>
            </label>

            <fieldset class="field">
              <legend class="field__label">Rolle</legend>
              <div class="segmented" role="radiogroup" aria-label="Rolle">
                <label class="segmented__opt">
                  <input type="radio" name="build-role" value="killer" checked>
                  <span><span class="icon" data-icon="killer"></span>Killer</span>
                </label>
                <label class="segmented__opt">
                  <input type="radio" name="build-role" value="survivor">
                  <span><span class="icon" data-icon="survivor"></span>Survivor</span>
                </label>
              </div>
            </fieldset>

            <label class="field">
              <span class="field__label">Charakter <em>optional</em></span>
              <span class="select-row">
                <select id="b-character"></select>
                <span class="portrait" id="b-character-portrait"></span>
              </span>
            </label>

            <div class="settings-row">
              <button type="submit" class="btn btn--primary" id="b-submit">Build speichern</button>
              <button type="button" class="btn btn--ghost" id="b-reset">Leeren</button>
            </div>
          </form>
        </div>
      </section>

      <!-- Gespeicherte Builds -->
      <section class="panel">
        <header class="panel__head panel__head--row">
          <h2>Meine Builds</h2>
          <span class="panel__meta" id="build-count"></span>
        </header>
        <div id="build-list" class="build-groups"></div>
      </section>

      <!-- Perk-Katalog -->
      <section class="panel">
        <header class="panel__head panel__head--row">
          <h2>Alle Perks</h2>
          <span class="panel__meta" id="filter-info"></span>
        </header>

        <div class="filters__grid">
          <label class="field">
            <span class="field__label">Suche</span>
            <input type="text" id="fp-search" placeholder="Perk oder Charakter" autocomplete="off">
          </label>
          <label class="field">
            <span class="field__label">Rolle</span>
            <select id="fp-role">
              <option value="all">Alle</option>
              <option value="killer">Killer</option>
              <option value="survivor">Survivor</option>
            </select>
          </label>
          <label class="field">
            <span class="field__label">Zugehörigkeit</span>
            <select id="fp-owner">
              <option value="all">Alle</option>
              <option value="general">Allgemein</option>
              <option value="character">Charakterperks</option>
              <option value="unknown">Zuordnung offen</option>
            </select>
          </label>
          <label class="field">
            <span class="field__label">Charakter</span>
            <select id="fp-character">
              <option value="all">Alle</option>
            </select>
          </label>
        </div>

        <div id="perk-grid" class="perk-grid"></div>
      </section>
    </section>
  </main>

  <script type="module" src="assets/js/perks-page.js?v=63"></script>
</body>
</html>
