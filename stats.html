<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DBD Stats – Statistik</title>
  <meta name="description" content="Detaillierte Dead-by-Daylight-Statistik, filterbar nach Killer und Survivor.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128128;</text></svg>">
  <link rel="stylesheet" href="assets/css/style.css?v=62">
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <header class="topbar">
    <a class="topbar__brand" href="index.html">
      <span class="topbar__glyph icon" data-icon="logo"><i class="icon__fallback">&#9788;</i></span>
      <span>DBD&nbsp;Stats</span>
    </a>
    <nav class="topbar__nav">
      <a href="index.html">Übersicht</a>
      <a href="stats.html" class="is-active">Statistik</a>
      <a href="prestige.html">Prestige</a>
      <a href="perks.html">Perks</a>
      <a href="challenges.html">Challenges</a>
      <a href="friends.html">Freunde</a>
    </nav>
    <div class="topbar__user" data-auth-only hidden>
      <span class="topbar__email" data-user-email></span>
      <a class="icon-btn icon-btn--owner" href="cockpit.html" data-owner-only hidden
         title="Ticket-Cockpit" aria-label="Ticket-Cockpit">&#9670;</a>
      <a class="icon-btn" href="settings.html" title="Einstellungen" aria-label="Einstellungen">&#9881;</a>
      <button type="button" class="btn btn--ghost btn--sm" data-logout>Abmelden</button>
    </div>
  </header>

  <main>
  <div id="boot-error" class="boot-error" hidden></div>

  <!-- Kein Modul: läuft auch dann, wenn der Import der App scheitert, damit
       statt einer leeren Seite eine Meldung erscheint. -->
  <script>
    (function () {
      function rendered() {
        var auth = document.getElementById('auth-view');
        var app = document.getElementById('app-view');
        return (auth && auth.children.length > 0) || (app && !app.hidden);
      }
      function show(detail) {
        var box = document.getElementById('boot-error');
        if (!box || !box.hidden || rendered()) return;   // nur wenn wirklich nichts da ist
        box.hidden = false;
        box.innerHTML = '<strong>Die App konnte nicht geladen werden.</strong>'
          + '<span>Meist hilft vollständiges Neuladen (Strg+F5 bzw. Cmd+Shift+R).</span>'
          + '<code></code>';
        box.querySelector('code').textContent = detail || '';
      }
      window.addEventListener('error', function (e) {
        var el = e.target;
        if (el && el.tagName === 'IMG') return;          // fehlende Portraits sind egal
        show(e.message || (el && el.src ? 'Nicht ladbar: ' + el.src : ''));
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        show(e.reason && e.reason.message ? e.reason.message : String(e.reason || ''));
      });
    })();
  </script>

    <section id="auth-view" class="auth-view"></section>

    <section id="app-view" class="app-view" hidden>
      <div class="page-head">
        <h1>Statistik</h1>
        <span class="page-head__meta" id="filter-summary"></span>
      </div>

      <section class="panel filters" aria-label="Filter">
        <div class="filters__grid">
          <label class="field">
            <span class="field__label">Rolle</span>
            <select id="fl-role">
              <option value="all">Alle</option>
              <option value="killer">Killer</option>
              <option value="survivor">Survivor</option>
            </select>
          </label>

          <label class="field">
            <span class="field__label">Charakter</span>
            <select id="fl-character">
              <option value="all">Alle</option>
            </select>
          </label>

          <label class="field">
            <span class="field__label">Gamemode</span>
            <select id="fl-mode">
              <option value="all">Alle</option>
            </select>
          </label>

          <label class="field">
            <span class="field__label">Zeitraum</span>
            <select id="fl-range">
              <option value="all">Gesamt</option>
              <option value="today">Heute</option>
              <option value="7">7 Tage</option>
              <option value="30">30 Tage</option>
              <option value="90">90 Tage</option>
              <option value="custom">Von &ndash; bis</option>
            </select>
          </label>

          <label class="field" id="fl-from-field" hidden>
            <span class="field__label">Von</span>
            <input type="date" id="fl-from">
          </label>

          <label class="field" id="fl-to-field" hidden>
            <span class="field__label">Bis</span>
            <input type="date" id="fl-to">
          </label>

          <button type="button" class="btn btn--ghost" id="fl-reset">Zurücksetzen</button>
        </div>
      </section>

      <section class="kpi-grid">
        <article class="kpi">
          <span class="kpi__label">Matches</span>
          <strong class="kpi__value" id="kpi-total">–</strong>
          <span class="kpi__hint" id="kpi-split">–</span>
        </article>
        <article class="kpi kpi--killer">
          <span class="kpi__label"><span class="icon" data-icon="killer"></span>Kill-Rate</span>
          <strong class="kpi__value" id="kpi-killrate">–</strong>
          <span class="kpi__hint" id="kpi-kills">–</span>
        </article>
        <article class="kpi kpi--survivor">
          <span class="kpi__label"><span class="icon" data-icon="survivor"></span>Escape-Rate</span>
          <strong class="kpi__value" id="kpi-escaperate">–</strong>
          <span class="kpi__hint" id="kpi-escapes">–</span>
        </article>
        <article class="kpi kpi--bp">
          <span class="kpi__label"><span class="icon" data-icon="bp"></span>Blutpunkte</span>
          <strong class="kpi__value" id="kpi-bp">–</strong>
          <span class="kpi__hint" id="kpi-bp-avg">–</span>
        </article>
      </section>

      <section class="panel" id="character-panel" data-collapse>
        <header class="panel__head panel__head--row">
          <h2>Nach Charakter</h2>
          <span class="panel__meta">Spaltenkopf antippen zum Sortieren</span>
        </header>
        <div class="panel__body">
          <div class="table-wrap">
            <table class="table table--sortable" id="character-table">
              <thead>
                <tr>
                  <th><button type="button" class="th-sort" data-sort="character">Charakter</button></th>
                  <th class="num"><button type="button" class="th-sort" data-sort="matches">Matches</button></th>
                  <th class="num"><button type="button" class="th-sort" data-sort="hits">Kills / Escapes</button></th>
                  <th class="num"><button type="button" class="th-sort" data-sort="quote">Quote</button></th>
                  <th class="num"><button type="button" class="th-sort" data-sort="streak">Serie</button></th>
                  <th class="num"><button type="button" class="th-sort" data-sort="best">Beste</button></th>
                  <th class="num"><button type="button" class="th-sort" data-sort="bp">BP</button></th>
                  <th class="num"><button type="button" class="th-sort" data-sort="bpAvg">Ø BP</button></th>
                </tr>
              </thead>
              <tbody id="character-body">
                <tr><td colspan="8" class="empty">Lade …</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- Nur sichtbar, sobald an Matches Perks hängen. -->
      <section class="panel" id="perk-panel" data-collapse hidden>
        <header class="panel__head panel__head--row">
          <h2>Nach Perk</h2>
          <span class="panel__meta" id="perk-count"></span>
        </header>
        <div class="panel__body">
          <div class="table-wrap">
            <table class="table table--sortable" id="perk-table">
              <thead>
                <tr>
                  <th><button type="button" class="th-sort" data-sort="perk">Perk</button></th>
                  <th class="num"><button type="button" class="th-sort" data-sort="matches">Matches</button></th>
                  <th class="num"><button type="button" class="th-sort" data-sort="pickrate">Pick-Rate</button></th>
                  <th class="num"><button type="button" class="th-sort" data-sort="hits">Kills / Escapes</button></th>
                  <th class="num"><button type="button" class="th-sort" data-sort="quote">Quote</button></th>
                  <th class="num"><button type="button" class="th-sort" data-sort="bpAvg">Ø BP</button></th>
                </tr>
              </thead>
              <tbody id="perk-body"></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- Nur sichtbar, sobald an Matches Ausrüstung hängt. -->
      <section class="panel" id="loadout-panel" data-collapse hidden>
        <header class="panel__head panel__head--row">
          <h2>Nach Ausrüstung</h2>
          <span class="panel__meta" id="loadout-count"></span>
        </header>
        <div class="panel__body">
          <div class="table-wrap">
            <table class="table table--sortable" id="loadout-table">
              <thead>
                <tr>
                  <th><button type="button" class="th-sort" data-sort="name">Item / Add-on</button></th>
                  <th class="num"><button type="button" class="th-sort" data-sort="matches">Matches</button></th>
                  <th class="num"><button type="button" class="th-sort" data-sort="pickrate">Pick-Rate</button></th>
                  <th class="num"><button type="button" class="th-sort" data-sort="hits">Kills / Escapes</button></th>
                  <th class="num"><button type="button" class="th-sort" data-sort="quote">Quote</button></th>
                  <th class="num"><button type="button" class="th-sort" data-sort="bpAvg">Ø BP</button></th>
                </tr>
              </thead>
              <tbody id="loadout-body"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section class="panel" id="faced-panel" data-collapse hidden>
        <header class="panel__head">
          <h2>Gegen Killer</h2>
        </header>
        <div class="panel__body">
          <div class="table-wrap">
            <table class="table table--sortable" id="faced-table">
              <thead>
                <tr>
                  <th><button type="button" class="th-sort" data-sort="killer">Killer</button></th>
                  <th class="num"><button type="button" class="th-sort" data-sort="matches">Matches</button></th>
                  <th class="num"><button type="button" class="th-sort" data-sort="escapes">Entkommen</button></th>
                  <th class="num"><button type="button" class="th-sort" data-sort="deaths">Gestorben</button></th>
                  <th class="num"><button type="button" class="th-sort" data-sort="rate">Escape-Rate</button></th>
                  <th class="num"><button type="button" class="th-sort" data-sort="bpAvg">Ø BP</button></th>
                </tr>
              </thead>
              <tbody id="faced-body"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section class="panel" id="top-panel" data-collapse>
        <header class="panel__head">
          <h2>Top-Charaktere</h2>
        </header>
        <div class="panel__body">
          <div id="top-bars" class="bars"></div>
        </div>
      </section>

      <section class="panel" id="match-panel" data-collapse>
        <header class="panel__head panel__head--row">
          <h2>Matches</h2>
          <span class="panel__meta" id="match-count"></span>
        </header>
        <div class="panel__body">
          <div class="table-wrap">
            <table class="table table--sortable" id="match-table">
              <thead>
                <tr>
                  <th><button type="button" class="th-sort" data-sort="date">Datum</button></th>
                  <th><button type="button" class="th-sort" data-sort="character">Charakter</button></th>
                  <th><button type="button" class="th-sort" data-sort="mode">Gamemode</button></th>
                  <th><button type="button" class="th-sort" data-sort="result">Ergebnis</button></th>
                  <th>Ausrüstung</th>
                  <th class="num"><button type="button" class="th-sort" data-sort="bp">BP</button></th>
                  <th>Notiz</th>
                  <th class="num"></th>
                </tr>
              </thead>
              <tbody id="match-body">
                <tr><td colspan="8" class="empty">Lade …</td></tr>
              </tbody>
            </table>
          </div>

          <!-- Blättert in Dreißigerschritten durch die gefilterten Matches. -->
          <nav class="pager" id="match-pager" aria-label="Seiten" hidden>
            <button type="button" class="btn btn--ghost btn--sm" id="page-prev"
                    aria-label="Vorherige Seite">&#8249;</button>
            <span class="pager__info" id="page-info"></span>
            <button type="button" class="btn btn--ghost btn--sm" id="page-next"
                    aria-label="Nächste Seite">&#8250;</button>
          </nav>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="assets/js/stats.js?v=62"></script>
</body>
</html>
